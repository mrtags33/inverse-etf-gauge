name: Update data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC weekdays, after the US close (5:30/6:30pm ET)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
